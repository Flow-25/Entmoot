<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entmoot</title>
  <meta name="description" content="Account-free group decisions by link. Call a moot, share it, and reach a decision without being hasty.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('entmoot-theme'); } catch {}
      const t = new URLSearchParams(location.search).get('theme') || saved ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
